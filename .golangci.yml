# golangci-lint 설정 (v2 형식). task lint · task fmt와 GitHub Actions가 같이 쓴다.
# 비유: 검사관 여러 명을 한 팀으로 묶은 명단 — 누구를 부를지, 어떤 서류는 안 볼지 적는다.
version: "2"

linters:
  # 기본 묶음: errcheck · govet · ineffassign · staticcheck · unused
  default: standard
  enable:
    - gosec          # 보안 실수 (타임아웃 없는 서버, 약한 난수 등)
    - errorlint      # 에러를 == 로 비교하는 실수 → errors.Is / errors.As
    - bodyclose      # HTTP 응답 본문을 안 닫음 (M2 유출 비밀번호 확인 등 외부 API 호출)
    - noctx          # context 없는 HTTP 요청 · DB 호출
    - sqlclosecheck  # DB rows · stmt를 안 닫음 (M2부터)
    - rowserrcheck   # rows.Err() 확인 빠뜨림 (M2부터)
  exclusions:
    # "Code generated ... DO NOT EDIT" 머리말이 있는 파일(apigen, 나중의 sqlc)은 보지 않는다.
    generated: lax
    presets:
      - std-error-handling      # defer x.Close() 같은 흔한 곳의 errcheck 경고를 뺀다
      - common-false-positives
    rules:
      # 테스트에는 일부러 지어낸 가짜 비밀번호가 들어간다 ("에러에 비밀번호가 새지 않는다"를 확인하려고).
      # 운영 코드의 G101은 그대로 잡는다.
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
