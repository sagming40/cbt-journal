# 자주 쓰는 명령 모음 (ARCHITECTURE 6절). task 또는 task --list로 목록을 본다.
# 비유: 리모컨 — 버튼(task 이름) 하나에 여러 동작(cmds)을 묶어 둔다.
version: '3'

# .env를 읽어 모든 명령의 환경변수로 넘긴다. 터미널에서 따로 불러오지 않아도 된다.
# 파일이 없으면 조용히 넘어가고, 터미널에 이미 있는 값은 덮어쓰지 않는다.
# Go 코드는 .env를 읽지 않는다 — 운영 서버는 진짜 환경변수로 돈다.
dotenv: ['.env']

# 여러 작업이 동시에 돌 때(task dev) 줄마다 [작업 이름]을 붙여 구분한다.
output: prefixed

tasks:
  default:
    desc: 명령 목록
    silent: true
    cmds:
      - task --list

  setup:
    desc: Go · 프론트 의존성 받기 (처음 한 번, pull 뒤 go.mod · pnpm-lock.yaml이 바뀌었을 때)
    cmds:
      - go mod download
      - task: web:install

  dev:
    desc: 개발 서버 — API(air, 8080) + 프론트(Vite, 5176). Ctrl+C로 둘 다 끈다
    # deps는 동시에 돈다: 터미널 하나로 둘 다 띄운다.
    deps: [dev:api, dev:web]

  dev:api:
    internal: true
    cmds:
      - go tool air

  dev:web:
    internal: true
    dir: web
    cmds:
      # pnpm dev는 Windows에서 vite.cmd(배치 파일)를 거쳐서, Ctrl+C 때 cmd가 "일괄 작업을 끝내시겠습니까 (Y/N)?"를
      # 묻고 Task가 실패로 끝난다. node로 Vite를 직접 띄워 배치 파일을 건너뛴다. (web/package.json의 dev와 같은 일)
      # ignore_error: Windows에서 Ctrl+C로 끝나면 종료 코드가 0xC000013A라 Task에는 58로 보인다. 정상 종료라 실패로 치지 않는다.
      # (포트가 차 있는 등 진짜 시작 실패도 Task 종료 코드로는 안 잡히지만, Vite 오류 문구는 그대로 화면에 나온다.)
      - cmd: node node_modules/vite/bin/vite.js dev
        ignore_error: true

  gen:
    desc: 생성 코드 — openapi.yaml → Go(internal/apigen) · TS(web/src/lib/api), queries/*.sql → Go(internal/db/dbgen). Docker 필요
    cmds:
      - go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      # sqlc는 Postgres 파서가 C 라이브러리라 Windows에서 설치가 까다롭다. 버전을 고정한 Docker 이미지로 돌려
      # 두 PC · CI가 같은 결과를 낸다 (버전을 올리면 생성 코드도 다시 만들어 커밋한다).
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src sqlc/sqlc:1.31.1 generate
      - task: web:gen

  test:
    desc: Go 테스트(통합 테스트는 Docker 필요 — 꺼져 있으면 건너뜀) + 프론트 Vitest
    cmds:
      - go test ./...
      - task: web:test

  lint:
    desc: golangci-lint(govet · staticcheck · gosec …) + 프론트 타입 검사 · Prettier · ESLint
    cmds:
      - golangci-lint run
      - task: web:lint

  fmt:
    desc: 형식 자동으로 맞추기 — Go(gofmt · goimports) + 프론트(Prettier)
    cmds:
      - golangci-lint fmt
      - task: web:fmt

  build:
    desc: 프론트 빌드 → embed 자리로 복사 → 실행 파일 하나 (bin/app)
    cmds:
      - task: web:build
      - task: embed
      - go build -o bin/app{{exeExt}} ./cmd/app

  build:linux:
    desc: 운영 서버용 실행 파일 (Linux amd64, 커밋 번호 포함) → bin/app-linux-amd64
    vars:
      # 지금 커밋의 짧은 번호. 커밋 하지 않은 변경이 있으면 끝에 -dirty가 붙는다 ─ 배포스크립트가 그걸 보고 거부한다
      COMMIT:
        sh: git describe --always --dirty=-dirty --abbrev=12 --exclude="*"
    # env는 작업 단위로 건다. cmd 하나에 건 env는 Task가 조용히 무시해서 Windows용이 만들어졌다. (2026-10-31)
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - task: web:build
      - task: embed
      # GOOS · GOARCH: Windows에서 Linux용을 만든다(Cross Compile) CGO_ENABLED=0: C 라이브러리 없이 순수 Go로만
      # ─ 서버에서 따로 깔 게 없는 실행 파일 하나가 된다 (ARCHITECTURE 7.1절)
      # ─ -trimpath: 내 PC 폴더 경로(D:\_dev\…)를 실행 파일에서 지운다. -s -w: 디버그 정보를 제외시켜 크기를 줄인다
      - cmd: go build -trimpath -ldflags "-s -w -X main.version={{.COMMIT}}" -o bin/app-linux-amd64 ./cmd/app

  serve:
    desc: task build로 만든 실행 파일 띄우기 (.env 자동) → http://127.0.0.1:8080
    cmds:
      - ./bin/app{{exeExt}} serve

  migrate:
    desc: DB 마이그레이션. 기본은 up — 다른 것은 task migrate -- status 또는 task migrate -- down
    cmds:
      # -- 뒤에 적은 글자가 CLI_ARGS로 들어온다. 비어 있으면 up.
      - go run ./cmd/app migrate {{.CLI_ARGS | default "up"}}

  user:
    desc: 계정 관리 — task user -- create --email 이메일 --nickname 닉네임 · task user -- reset-password --email 이메일 (비밀번호는 실행 중에 물어본다)
    # 비밀번호를 화면에 안 보이게 입력받으려면 터미널을 그대로 넘겨야 한다.
    interactive: true
    cmds:
      - go run ./cmd/app user {{.CLI_ARGS}}

  # ── 아래는 내부용 (task --list에 안 보인다) ──

  web:install:
    internal: true
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  web:gen:
    internal: true
    dir: web
    cmds:
      - pnpm gen:api

  web:lint:
    internal: true
    dir: web
    cmds:
      - pnpm check
      - pnpm lint

  web:test:
    internal: true
    dir: web
    cmds:
      - pnpm test

  web:fmt:
    internal: true
    dir: web
    cmds:
      - pnpm format

  web:build:
    internal: true
    dir: web
    cmds:
      - pnpm build

  embed:
    internal: true
    # web/build → internal/webdist/dist (ARCHITECTURE 7절). dist를 통째로 지웠다 다시 만들고 .gitkeep을 새로 쓴다.
    # Windows에는 rm · cp가 없을 수 있어서 운영체제별로 따로 적는다 (Linux는 GitHub Actions용).
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force internal/webdist/dist -ErrorAction SilentlyContinue; Copy-Item -Recurse web/build internal/webdist/dist; New-Item -ItemType File internal/webdist/dist/.gitkeep | Out-Null"
        platforms: [windows]
      - cmd: rm -rf internal/webdist/dist && cp -r web/build internal/webdist/dist && touch internal/webdist/dist/.gitkeep
        platforms: [linux, darwin]
