# CBT 저널 API 계약서. API 모양의 원본은 이 파일 하나다 (CLAUDE.md "문서 지도").
# 고친 뒤에는 task gen으로 코드를 다시 만든다 → internal/apigen/ · web/src/lib/api/ (직접 고치지 않는 생성 코드).
openapi: 3.0.3
info:
  title: CBT 저널 API
  version: 0.2.0
  description: |
    인지행동치료 사고 기록 연습 앱의 API.
    JSON 필드는 snake_case, 시각은 RFC 3339 UTC (ARCHITECTURE 3.2절).
    오류는 전부 Error 모양이다. 화면 문구로 그대로 쓸 수 있게 message는 반말이다 (DESIGN 8장).

# 기본은 잠금 (ARCHITECTURE 3.1절): 모든 경로에 세션 쿠키가 필요하다.
# 인증 없이 열 경로만 security: []로 연다 — 새 경로를 추가하면 따로 하지 않아도 잠긴다.
security:
  - cookieAuth: []

# 형식(format: uuid · email)은 일부러 쓰지 않는다: 생성 코드가 별도 런타임 패키지를 끌어온다. 검증은 서버가 한다.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서버와 저장소 연결 확인
      description: |
        Postgres · Valkey에 실제로 붙어 보고 결과를 답한다. 하나라도 실패하면 503.
        로그인 없이 열리는 경로라 응답에는 ok / error만 싣는다 (ARCHITECTURE 3.1절).
      tags: [system]
      security: []
      responses:
        "200":
          description: 모두 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 하나 이상 연결 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/config:
    get:
      operationId: getConfig
      summary: 공개 설정
      description: 로그인 화면이 알아야 하는 값만 준다 (가입 허용 여부 등).
      tags: [system]
      security: []
      responses:
        "200":
          description: 공개 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      description: |
        성공하면 세션 쿠키를 준다. 없는 이메일 · 틀린 비밀번호는 같은 401이다(가입 여부를 드러내지 않게).
        IP · 계정별로 횟수를 제한한다(ARCHITECTURE 4절) — 제한 중이면 맞는 비밀번호도 429다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인됨
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/signup:
    post:
      operationId: signup
      summary: 회원가입
      description: ALLOW_SIGNUP이 꺼져 있으면 403. 성공하면 바로 로그인된다(로그인 유지 안 함).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입되고 로그인됨
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (지금 기기)
      tags: [auth]
      responses:
        "204":
          description: 로그아웃됨. 쿠키를 지운다
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me:
    get:
      operationId: getMe
      summary: 내 정보
      tags: [account]
      responses:
        "200":
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: 닉네임 · 시간대 바꾸기 (A4)
      description: 보낸 칸만 바꾼다.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 바뀐 내 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/password:
    put:
      operationId: changePassword
      summary: 비밀번호 바꾸기 (A3)
      description: |
        현재 비밀번호를 확인한다(틀린 횟수 제한, ARCHITECTURE 4절). 바꾸면 지금 세션을 뺀 다른 세션은 모두 끊긴다.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 바뀜
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/me/sessions/logout-others:
    post:
      operationId: logoutOtherSessions
      summary: 다른 기기 모두 로그아웃 (A8)
      tags: [account]
      responses:
        "200":
          description: 끊은 세션 수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutOthersResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly · Secure · SameSite=Lax 세션 쿠키. 토큰 원문은 쿠키에만 있다 (ARCHITECTURE 4절).

  headers:
    SetCookie:
      description: 세션 쿠키 (session=…; HttpOnly; Secure; SameSite=Lax)
      schema:
        type: string
    RetryAfter:
      description: 다시 시도해도 되는 때까지 남은 초
      schema:
        type: integer

  responses:
    BadRequest:
      description: 입력 오류. fields에 칸별 문구
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 로그인 안 됨 · 세션 만료 · 로그인 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 막힌 기능
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 충돌 (이미 있음 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 요청 제한
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, postgres, valkey]
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        postgres:
          $ref: "#/components/schemas/CheckStatus"
        valkey:
          $ref: "#/components/schemas/CheckStatus"
    CheckStatus:
      type: string
      enum: [ok, error]
      description: 연결 하나의 상태. 원인은 서버 로그에만 남긴다.

    Config:
      type: object
      required: [allow_signup]
      properties:
        allow_signup:
          type: boolean

    Error:
      type: object
      required: [error]
      description: 오류 봉투 (ARCHITECTURE 3.2절)
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 기계가 읽는 코드 (NOT_FOUND, INVALID_CREDENTIALS …)
            message:
              type: string
              description: 화면에 보여 줄 문구
            fields:
              type: object
              description: 입력 오류일 때 칸 이름 → 문구
              additionalProperties:
                type: string

    Me:
      type: object
      required: [id, email, nickname, timezone]
      properties:
        id:
          type: string
          description: UUID
        email:
          type: string
        nickname:
          type: string
        timezone:
          type: string
          description: IANA 시간대 이름 (Asia/Seoul)

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
        remember:
          type: boolean
          default: false
          description: 로그인 유지 (A1). 기본 해제 — 해제면 브라우저를 닫을 때 로그아웃

    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        nickname:
          type: string
          maxLength: 30

    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
        timezone:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 128
        new_password:
          type: string
          minLength: 12
          maxLength: 128

    LogoutOthersResult:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: 끊은 세션 수
