# sqlc: queries/*.sql에 직접 쓴 SQL → 타입이 있는 Go 함수 (decisions 0002 · 0004).
# 스키마는 goose 마이그레이션 파일을 그대로 읽는다(Down 부분은 sqlc가 알아서 무시) — 스키마의 원본은 마이그레이션 하나다.
# task gen이 Docker 이미지로 실행한다(Windows에서 설치 없이, 두 PC · CI가 같은 버전 — Taskfile.yml).
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
