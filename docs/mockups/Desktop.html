<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 화면 · D2</title>
<!-- PC(48rem 이상) 화면 보드 (DESIGN 3.2절 · 4장 · 6장 D2). 혼자 서는 파일이라 shared.js를 안 쓴다.
     색은 web/src/routes/layout.css의 D2 토큰 값을 그대로 옮겼다. 예시 문구 · 기록은 지어낸 것이다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #77777c; font-family: 'Pretendard', system-ui, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* ── 보드 바깥: 도구 막대 · 설명 ── */
  .toolbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 10px 20px; background: #202024; color: #eee; font-size: 13px; }
  .toolbar .grp { display: flex; gap: 4px; align-items: center; }
  .toolbar .grp > span { color: #9a9aa2; margin-right: 4px; }
  .toolbar button { border: 1px solid #44444c; background: #2c2c32; color: #ddd; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .toolbar button.on { background: #4457C2; border-color: #4457C2; color: #fff; }
  .stage { padding: 24px 24px 60px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .about { width: 1440px; max-width: 100%; color: #fff; font-size: 14px; line-height: 1.6; }
  .about h2 { margin: 0 0 4px; font-size: 18px; }
  .about ul { margin: 6px 0 0; padding-left: 18px; }
  .zoomer { transform-origin: top center; }

  /* ── D2 토큰 (layout.css와 같은 값) ── */
  .app { --bg:#F5F2EA; --surface:#FBF9F4; --surface2:#E9E4D8; --border:#DDD6C7; --input:#8C8576; --text:#22211D; --muted:#6A665C;
         --accent:#33449E; --accentText:#2E3D90; --onAccent:#fff;
         --tint: color-mix(in oklab, var(--accent) 8%, var(--surface)); --line: color-mix(in oklab, var(--accent) 45%, var(--surface));
         --rule: color-mix(in oklab, var(--accent) 13%, transparent); --dot: var(--accent); }
  .app.dark { --bg:#15161A; --surface:#1B1C21; --surface2:#2A2B31; --border:#2E2F36; --input:#6E6F78; --text:#ECEAE4; --muted:#A8A59C;
         --accent:#4457C2; --accentText:#A3AEF0;
         --tint: color-mix(in oklab, var(--accent) 16%, var(--surface)); --line: color-mix(in oklab, var(--accent) 60%, var(--surface));
         --rule: color-mix(in oklab, var(--accentText) 12%, transparent); --dot: var(--accentText); }

  .app { width: 1440px; min-height: 900px; background: var(--bg); color: var(--text); border-radius: 10px; overflow: hidden;
         box-shadow: 0 24px 70px rgba(0,0,0,.35); display: flex; word-break: keep-all; font-size: 15px; line-height: 1.55; }
  .app.top { flex-direction: column; }
  .serif { font-family: 'Gowun Batang', serif; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .accent { color: var(--accentText); }
  a.lk { color: var(--accentText); text-decoration: none; font-size: 14px; cursor: pointer; }
  a.lk:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* 메뉴 · 사이드바 */
  .side { width: 240px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 18px 22px;
          display: flex; flex-direction: column; gap: 4px; min-height: 900px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-family: 'Gowun Batang', serif; font-size: 19px; }
  .brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .logo { color: var(--accent); flex: none; } .dark .logo { color: var(--accentText); }
  .side nav { margin-top: 32px; display: flex; flex-direction: column; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; color: var(--text); cursor: pointer; }
  .side nav a:hover { background: var(--surface2); }
  .side nav a.on { background: var(--tint); color: var(--accentText); font-weight: 700; }
  .side nav a svg { width: 18px; height: 18px; }
  .side .grow { flex: 1; }
  .side .who { display: flex; align-items: center; gap: 10px; padding: 14px 4px 0; margin-top: 14px; border-top: 1px dashed var(--border); font-size: 14px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--input); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

  /* 메뉴 · 위 막대 */
  .topbar { height: 68px; flex: none; display: flex; align-items: center; gap: 40px; padding: 0 48px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .topbar nav { display: flex; gap: 28px; height: 100%; }
  .topbar nav a { display: flex; align-items: center; height: 100%; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .topbar nav a.on { color: var(--accentText); font-weight: 700; border-color: var(--accent); }
  .topbar .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }

  .main { flex: 1; min-width: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 48px 64px; }

  /* 버튼 · 입력 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 6px;
         border: 1px solid var(--input); background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface2); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--onAccent); }
  .btn.p:hover { background: color-mix(in oklab, var(--accent) 88%, black); }
  .btn.p:disabled { opacity: .4; cursor: not-allowed; }
  .btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--accentText); }
  .btn.block { width: 100%; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; font-weight: 600; }
  .box { height: 46px; border-radius: 6px; border: 1px solid var(--input); background: var(--surface); padding: 0 14px; width: 100%; }
  .ruled { height: 34px; border: 0; border-bottom: 1px solid var(--input); background: transparent; width: 100%; padding: 0 2px; }
  .box:focus, .ruled:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--input); border-radius: 6px; overflow: hidden; }
  .seg button { height: 34px; padding: 0 14px; border: 0; background: var(--surface); font-size: 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--input); }
  .seg button.on { background: var(--tint); color: var(--accentText); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
  .chip { height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--input); background: var(--surface); cursor: pointer; font-size: 15px; }
  .chip.on { background: var(--tint); border-color: var(--accent); color: var(--accentText); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }
  .chip.sm { height: 32px; font-size: 13px; padding: 0 10px; }
  .kbd { font-size: 12px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

  /* 종이 · 구역 */
  .paper { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 6px; }
  .sec h3 { font-family: 'Gowun Batang', serif; font-size: 18px; margin: 0; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  .pagehead .d { font-family: 'Gowun Batang', serif; color: var(--muted); font-size: 16px; }
  .pagehead h1 { font-family: 'Gowun Batang', serif; font-size: 34px; line-height: 1.3; margin: 6px 0 0; }
  .tag { font-size: 12px; color: var(--muted); border: 1px dashed var(--input); border-radius: 4px; padding: 1px 6px; }

  /* 일기 형식 줄 */
  .entry { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; padding: 16px 4px; border-bottom: 1px dashed var(--border); cursor: pointer; }
  .entry:hover { background: color-mix(in oklab, var(--surface2) 45%, transparent); }
  .entry time { font-family: 'Gowun Batang', serif; color: var(--muted); font-size: 16px; padding-top: 1px; }
  .entry .em { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 16px; }
  .entry .memo { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .entry .kind { font-size: 12px; color: var(--accentText); font-weight: 700; letter-spacing: .02em; }
  .dots { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--dot); }
  .dots i.f { background: var(--dot); }
  .lines { background: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); }

  /* 체크인 원 (DESIGN 6장 "체크인 원") */
  .orb { width: 188px; height: 188px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; position: relative; cursor: pointer;
         box-shadow: 0 0 0 12px var(--tint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .orb b { font-family: 'Gowun Batang', serif; font-size: 24px; }
  .orb span { font-size: 13px; opacity: .85; }
  .orb::before { content: ''; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid var(--line); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .orb::before { animation: none; } }

  /* 슬라이더 */
  input[type=range] { width: 100%; accent-color: var(--accent); height: 26px; }
  .sl { padding: 14px 0; border-bottom: 1px dashed var(--border); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .sl .n { font-family: 'Gowun Batang', serif; font-weight: 700; }
  .sl .v { font-weight: 700; font-size: 18px; }
  .sl input { grid-column: 1 / -1; }

  /* 진행 막대 */
  .prog { display: flex; gap: 3px; } .prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface2); } .prog i.on { background: var(--accent); }

  /* 통계 */
  .tile { padding: 18px 20px; }
  .tile .k { font-size: 13px; color: var(--muted); }
  .tile .v { font-size: 30px; font-weight: 700; margin-top: 6px; }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  svg text { fill: var(--muted); font-size: 11px; font-family: 'Pretendard', sans-serif; }
</style>
</head>
<body>
<div class="toolbar">
  <div class="grp" id="screens"><span>화면</span></div>
  <div class="grp" id="navs"><span>메뉴</span></div>
  <div class="grp"><span>테마</span><button id="darkBtn">다크</button></div>
</div>
<div class="stage">
  <div class="about" id="about"></div>
  <div class="zoomer" id="zoomer"><div id="app" class="app"></div></div>
</div>

<script>
const LOGO = s => `<svg class="logo" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="36" r="14" fill="currentColor"/><circle cx="43" cy="26" r="14" fill="none" stroke="currentColor" stroke-width="3.5"/></svg>`;
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  records: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>'
};
const EMOTIONS = ['불안','두려움','슬픔','무기력','분노','짜증','수치심','죄책감','외로움','좌절'];
const dots = v => { const f = Math.round(v / 20); return `<span class="dots" aria-hidden="true">${[0,1,2,3,4].map(i => `<i class="${i < f ? 'f' : ''}"></i>`).join('')}</span>`; };

// 지어낸 예시 기록
const TODAY = [
  { t: '09:12', kind: '체크인', ems: [['불안', 60], ['무기력', 40]], memo: '출근길, 발표 자료가 아직 덜 됐다' },
  { t: '13:40', kind: '체크인', ems: [['짜증', 70]], memo: '' },
  { t: '18:05', kind: '사고 기록', ems: [['불안', 80, 35]], memo: '“또 내가 다 망쳤다”' },
];

const params = new URLSearchParams(location.search);
const state = { screen: params.get('screen') || 'today', nav: params.get('nav') || 'side', dark: params.get('dark') === '1' };

// ── 메뉴 틀 ──
function shell(active, body) {
  const items = [['today','오늘'],['records','기록'],['stats','통계'],['settings','설정']];
  if (state.nav === 'top') {
    return `<header class="topbar">
        <div class="brand">${LOGO(30)}<b>CBT 저널</b></div>
        <nav>${items.slice(0,3).map(([k,l]) => `<a class="${k===active?'on':''}" data-go="${k}">${l}</a>`).join('')}</nav>
        <div class="r"><button class="btn p sm" data-go="checkin">+ 체크인</button>
          <a class="avatar ${active==='settings'?'accent':''}" data-go="settings" title="설정" style="cursor:pointer">하</a></div>
      </header><div class="main">${body}</div>`;
  }
  return `<aside class="side">
      <div class="brand">${LOGO(34)}<div><b>CBT 저널</b><small>한 걸음 떨어져, 내 마음을 다시 보기</small></div></div>
      <nav>${items.map(([k,l]) => `<a class="${k===active?'on':''}" data-go="${k}">${ICON[k]}${l}</a>`).join('')}</nav>
      <div class="grow"></div>
      <button class="btn p block" data-go="checkin">+ 체크인</button>
      <div class="who"><span class="avatar">하</span><div>하루<br><span class="muted" style="font-size:12px">Asia/Seoul</span></div></div>
    </aside><div class="main">${body}</div>`;
}

function entryHTML(e) {
  if (e.kind === '사고 기록') {
    const [n, b, a] = e.ems[0];
    return `<div class="entry"><time class="num">${e.t}</time>
      <div><div class="kind">사고 기록</div><span class="em">${n}</span> <span class="num">${b} → ${a}</span>
      <div class="memo">${e.memo}</div></div><span class="muted">›</span></div>`;
  }
  return `<div class="entry"><time class="num">${e.t}</time>
    <div>${e.ems.map(([n, v]) => `<div><span class="em">${n}</span> <span class="num">${v}</span>${dots(v)}</div>`).join('')}
    ${e.memo ? `<div class="memo">${e.memo}</div>` : ''}</div><span class="muted">›</span></div>`;
}

// ── 화면들 ──
const SCREENS = {
  today: {
    label: 'S-02 오늘',
    about: `<h2>S-02 오늘 — 2단</h2><ul>
      <li>왼쪽 종이 한 장에 <b>체크인 원 + 사고 기록 쓰기 + 이어 쓰기</b>(지금 할 일), 오른쪽에 <b>오늘 일기</b>(한 일). 휴대폰은 같은 내용을 위아래로 쌓는다.</li>
      <li>머리 오른쪽 "이번 주" 7칸 — 날마다 기록 수만큼 점. 색 없이 개수만(빨강 · 초록 금지). 누르면 기록 목록 그날로.</li>
      <li>아래 "이번 주 한눈에" 타일은 통계(M6) 이후. 그 전에는 자리를 비운다.</li>
      <li>글자 하나짜리 단축키(체크인 <span class="kbd">C</span>)는 처음 안에 있었지만 뺐다 — 화면 낭독기 키와 부딪힌다(DESIGN 8장).</li></ul>`,
    render: () => shell('today', `<div class="wrap">
      <div class="pagehead">
        <div><div class="d">2026년 11월 1일 일요일</div><h1>오늘은 어떤 하루였나요?</h1></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <span class="serif muted" style="font-size:14px">이번 주</span>
          <div style="display:flex;gap:6px">${['월','화','수','목','금','토','일'].map((d, i) => {
            const n = [2,3,0,1,4,2,3][i], on = i === 6;
            return `<div style="width:42px;text-align:center;padding:6px 0 8px;border-radius:6px;${on?'background:var(--tint);box-shadow:inset 0 -2px 0 var(--accent)':''}">
              <div style="font-size:12px" class="${on?'accent':'muted'}">${d}</div>
              <div class="num" style="font-weight:${on?700:500}">${26 + i > 31 ? 26 + i - 31 : 26 + i}</div>
              <div style="display:flex;gap:2px;justify-content:center;height:6px;margin-top:3px">${Array.from({length: Math.min(n, 4)}, () => '<i style="width:4px;height:4px;border-radius:50%;background:var(--dot)"></i>').join('')}</div></div>`; }).join('')}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start">
        <div class="paper" style="padding:36px 28px 24px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:18px">
            <div style="padding:14px"><button class="orb" data-go="checkin"><b>체크인</b><span>10초면 돼요</span></button></div>
            <span class="muted" style="font-size:14px">숨 한 번 고르고 눌러요</span>
            <button class="btn block">사고 기록 쓰기</button>
          </div>
          <div style="margin-top:30px;padding-top:18px;border-top:1px solid var(--border)">
            <div class="sec"><h3>이어 쓰기</h3><span class="muted" style="font-size:13px">1</span></div>
            <div style="padding:12px 0">
              <div style="display:flex;justify-content:space-between;font-size:14px"><span>회의 끝나고 팀장님이…</span><span class="muted">2시간 전</span></div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div class="prog" style="flex:1">${[1,2,3,4,5,6,7,8].map(i => `<i class="${i<=3?'on':''}"></i>`).join('')}</div><span class="muted num" style="font-size:12px">3/8</span></div>
            </div>
          </div>
        </div>
        <div>
          <div class="sec"><h3>오늘</h3><a class="lk" data-go="records">기록 전체 ›</a></div>
          <div style="border-top:1px solid var(--border)">${TODAY.map(entryHTML).join('')}</div>
          <div style="margin-top:36px">
            <div class="sec"><h3>이번 주 한눈에</h3><span class="tag">통계(M6)부터</span></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px">
              <div class="paper tile"><div class="k">체크인</div><div class="v num">13<small>번</small></div></div>
              <div class="paper tile"><div class="k">사고 기록</div><div class="v num">2<small>편</small></div></div>
              <div class="paper tile"><div class="k">가장 자주 고른 감정</div><div class="v serif" style="font-size:26px">불안</div></div>
            </div>
          </div>
        </div>
      </div></div>`)
  },

  empty: {
    label: 'S-02 오늘 · 0건',

    render: () => {
      const row = (k, d, c) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:16px 0;border-top:1px dashed var(--border)"><div><div style="font-weight:600">${k}</div>${d ? `<div class="muted" style="font-size:13px">${d}</div>` : ''}</div><div style="flex:none">${c}</div></div>`;
      const card = (id, t, rows, later) => `<section class="paper" style="padding:22px 26px 8px;margin-bottom:16px;${later?'opacity:.6':''}"><div class="sec" style="margin-bottom:10px"><h3>${t}</h3>${later?'<span class="tag">나중에(S)</span>':''}</div>${rows.join('')}</section>`;
      return shell('settings', `<div class="wrap" style="max-width:1000px">
        <div class="pagehead"><div><h1 style="margin:0">설정</h1></div></div>
        <div style="display:grid;grid-template-columns:180px 1fr;gap:40px;align-items:start">
          <nav style="position:sticky;top:24px;display:flex;flex-direction:column;gap:2px;font-size:15px">
            ${['계정','표시','리마인더','데이터'].map((l,i) => `<a style="padding:8px 12px;border-left:2px solid ${i?'var(--border)':'var(--accent)'};${i?'':'color:var(--accentText);font-weight:700'}">${l}</a>`).join('')}
          </nav>
          <div>
            ${card('a','계정',[row('닉네임','화면에 보이는 이름','<input class="box" style="width:220px;height:38px" value="하루">'), row('이메일','로그인에 쓰는 주소 · 바꿀 수 없어요','<span class="muted">haru@example.com</span>'), row('비밀번호','','<button class="btn sm">바꾸기</button>'), row('다른 기기 모두 로그아웃','이 기기만 남기고 나머지는 다시 로그인해야 해요','<button class="btn sm">로그아웃시키기</button>')])}
            ${card('b','표시',[row('시간대','"오늘"을 나누는 기준이에요','<button class="btn sm">Asia/Seoul ▾</button>'), row('테마','','<div class="seg"><button class="on">시스템</button><button>라이트</button><button>다크</button></div>')])}
            ${card('c','리마인더',[row('알림 받기','누를 때만 브라우저가 허용을 물어요','<button class="btn sm">알림 허용</button>')], true)}
            ${card('d','데이터',[row('내보내기','모든 기록을 JSON 파일 하나로','<button class="btn sm">내려받기</button>'), row('회원 탈퇴','기록이 모두 지워지고 되돌릴 수 없어요','<button class="btn sm">탈퇴하기</button>')], true)}
            <div style="padding:8px 0"><button class="btn">로그아웃</button></div>
          </div>
        </div></div>`);
    }
  },

  login: {
    label: 'S-01 로그인',
    about: `<h2>S-01 로그인 — 반으로 나눈 첫 화면</h2><ul>
      <li>왼쪽 반은 이 앱이 뭔지 한 번에: 큰 로고 · 부제 · 세 줄 소개. 꾸밈은 로고의 두 원을 크게 흐리게 깐 것 하나.</li>
      <li>오른쪽은 지금 앱의 폼 그대로(상자 입력칸 유지, DESIGN 9.1). "로그인 유지"는 기본 해제 + 안내 한 줄.</li>
      <li>메뉴 선택과 상관없이 같은 모양이다.</li></ul>`,
    bare: true,
    render: () => `<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:900px">
      <div style="position:relative;overflow:hidden;background:var(--surface);border-right:1px solid var(--border);padding:72px 80px;display:flex;flex-direction:column">
        <div class="brand">${LOGO(36)}<b>CBT 저널</b></div>
        <div style="margin-top:auto;position:relative;z-index:1">
          <h1 class="serif" style="font-size:44px;line-height:1.35;margin:0">한 걸음 떨어져,<br>내 마음을 다시 보기</h1>
          <ul style="list-style:none;padding:0;margin:34px 0 0;display:flex;flex-direction:column;gap:14px">
            ${[['10초 체크인','지금 감정을 그 자리에서 붙잡아요'],['사고 기록','떠오른 생각과 사실을 나눠 봐요'],['나만 보는 기록','쓴 내용은 로그에도 남기지 않아요']]
              .map(([a,b]) => `<li style="display:flex;gap:12px;align-items:baseline"><span style="width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none;transform:translateY(-2px)"></span><span><b class="serif">${a}</b> <span class="muted">— ${b}</span></span></li>`).join('')}
          </ul>
        </div>
        <div style="margin-top:auto"></div>
        <svg width="560" height="560" viewBox="0 0 64 64" style="position:absolute;right:-170px;top:40px;opacity:.07;color:var(--accent)"><circle cx="22" cy="36" r="14" fill="currentColor"/><circle cx="43" cy="26" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </div>
      <div style="display:flex;align-items:center;justify-content:center">
        <form style="width:380px;display:flex;flex-direction:column;gap:18px" onsubmit="return false">
          <div><h2 class="serif" style="font-size:30px;margin:0">다시 오셨네요</h2><p class="muted" style="margin:6px 0 0">이메일과 비밀번호로 로그인해요.</p></div>
          <div class="field"><label>이메일</label><input class="box" placeholder="you@example.com"></div>
          <div class="field"><label>비밀번호</label><input class="box" type="password"></div>
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" style="accent-color:var(--accent);margin-top:4px"><span>로그인 유지<br><span class="muted" style="font-size:13px">공용 · 회사 PC에서는 체크하지 마세요</span></span></label>
          <button class="btn p block" style="height:48px">로그인</button>
          <p class="muted" style="text-align:center;font-size:14px;margin:0">계정이 없나요? <a class="lk">가입하기</a></p>
        </form>
      </div></div>`
  }
};

// ── 그리기 · 도구 막대 ──
const order = ['login','today','empty','checkin','record','records','stats','settings'];
function sync() {
  const q = new URLSearchParams({ screen: state.screen, nav: state.nav, ...(state.dark ? { dark: '1' } : {}) });
  history.replaceState(null, '', '?' + q);
}
function draw() {
  const s = SCREENS[state.screen];
  const app = document.getElementById('app');
  app.className = 'app' + (state.dark ? ' dark' : '') + (state.nav === 'top' && !s.bare ? ' top' : '');
  app.innerHTML = s.render();
  document.getElementById('about').innerHTML = s.about;
  s.after && s.after();
  document.querySelectorAll('#screens button').forEach(b => b.classList.toggle('on', b.dataset.s === state.screen));
  document.querySelectorAll('#navs button').forEach(b => b.classList.toggle('on', b.dataset.n === state.nav));
  document.getElementById('darkBtn').classList.toggle('on', state.dark);
  fit(); sync();
}
function fit() {
  const z = Math.min(1, (window.innerWidth - 48) / 1440);
  const el = document.getElementById('zoomer');
  el.style.transform = `scale(${z})`;
  el.style.height = (document.getElementById('app').offsetHeight * z) + 'px';
}
document.getElementById('screens').insertAdjacentHTML('beforeend', order.map(k => `<button data-s="${k}">${SCREENS[k].label}</button>`).join(''));
document.getElementById('navs').insertAdjacentHTML('beforeend', '<button data-n="side">사이드바</button><button data-n="top">위 메뉴</button>');
document.getElementById('screens').onclick = e => { if (e.target.dataset.s) { state.screen = e.target.dataset.s; draw(); } };
document.getElementById('navs').onclick = e => { if (e.target.dataset.n) { state.nav = e.target.dataset.n; draw(); } };
document.getElementById('darkBtn').onclick = () => { state.dark = !state.dark; draw(); };
document.getElementById('app').addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g && SCREENS[g.dataset.go]) { state.screen = g.dataset.go; draw(); } });
window.addEventListener('resize', fit);
draw();
</script>
</body>
</html>
