<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로고 요즘 스타일</title>
<!-- 로고 시안 1 ~ 8(Logo.html)의 상징에 요즘 많이 쓰는 표현 방식 넷을 입혀 본다 — 앱 아이콘 중심.
     색은 남색 한 계열만(DESIGN 6장): 잉크 #33449E · #4457C2 · 연남 #6F7FDB · #A3AEF0 · 짙은 남 #1E2766, 종이 #F5F2EA.
     상징 모양은 Logo.html과 같다(여기에 다시 정의). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECE8DE; font-family: 'Pretendard', system-ui, sans-serif; color: #22211D; }
  .bar { position: sticky; top: 0; z-index: 2; padding: 8px 16px; background: #222; color: #eee; font-size: 13px; }
  .wrap { padding: 24px; }
  h1 { font-family: 'Gowun Batang', serif; font-size: 26px; margin: 0 0 6px; }
  .lead { margin: 0 0 20px; color: #6A665C; font-size: 14px; line-height: 1.6; }
  table { border-collapse: separate; border-spacing: 14px 10px; margin-left: -14px; }
  th { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 16px; text-align: center; padding-bottom: 2px; }
  th small { display: block; font-family: 'Pretendard', sans-serif; font-weight: 400; font-size: 12px; color: #6A665C; margin-top: 2px; }
  td.name { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 15px; white-space: nowrap; padding-right: 6px; }
  td.cell { text-align: center; }
  .pair { display: flex; align-items: flex-end; gap: 10px; justify-content: center; }
  .pair .mini { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  /* 휴대폰 홈 화면처럼 보이게 아이콘 아래 그림자 하나만 */
  .icon { filter: drop-shadow(0 6px 12px rgba(30,39,102,.22)); }
</style>
</head>
<body>
<div class="bar"><strong>로고 요즘 스타일</strong> · 상징 1 ~ 8 × 표현 방식 4 · 큰 것은 앱 아이콘(112px), 옆 작은 것은 같은 아이콘 40 · 24px</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ── 상징 (Logo.html과 같은 모양) ── -->
    <symbol id="m1" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="currentColor"/><circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="3" opacity=".55"/><circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="2" opacity=".28"/></symbol>
    <symbol id="m2" viewBox="0 0 64 64"><circle cx="26" cy="32" r="16" fill="currentColor"/><circle cx="38" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/></symbol>
    <symbol id="m3" viewBox="0 0 64 64"><path d="M14 8h26l12 12v36H14z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M40 8v12h12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><line x1="21" y1="32" x2="45" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><line x1="21" y1="41" x2="38" y2="41" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><circle cx="24" cy="21" r="4.5" fill="currentColor"/></symbol>
    <symbol id="m4" viewBox="0 0 64 64"><clipPath id="m4c"><circle cx="32" cy="32" r="24"/></clipPath><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="0" y="35" width="64" height="40" fill="currentColor" clip-path="url(#m4c)"/><line x1="16" y1="27" x2="48" y2="27" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".45"/></symbol>
    <symbol id="m5" viewBox="0 0 64 64"><circle cx="22" cy="36" r="14" fill="currentColor"/><circle cx="43" cy="26" r="14" fill="none" stroke="currentColor" stroke-width="3.5"/></symbol>
    <symbol id="m6" viewBox="0 0 64 64"><circle cx="26" cy="32" r="17" fill="currentColor"/><line x1="46" y1="32" x2="52" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 5.5" opacity=".7"/><circle cx="57" cy="32" r="4.5" fill="currentColor"/></symbol>
    <symbol id="m7" viewBox="0 0 64 64"><circle cx="32" cy="22" r="13" fill="currentColor"/><line x1="10" y1="39" x2="54" y2="39" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M21 45a11 7 0 0 0 22 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><path d="M25 52a7 4 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".3"/></symbol>
    <symbol id="m8" viewBox="0 0 64 64"><path d="M28 12a20 20 0 0 0 0 40z" fill="currentColor"/><path d="M36 12a20 20 0 0 1 0 40z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/></symbol>

    <!-- ── 바탕 ── -->
    <!-- 글래스: 짙은 남 → 잉크 남 그라데이션 + 뒤에 번진 빛 두 개(유리 너머로 비쳐 보이게) -->
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4457C2"/><stop offset="1" stop-color="#1E2766"/></linearGradient>
    <radialGradient id="g-glow1" cx=".3" cy=".3" r=".5"><stop offset="0" stop-color="#A3AEF0" stop-opacity=".85"/><stop offset="1" stop-color="#A3AEF0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-glow2" cx=".78" cy=".8" r=".45"><stop offset="0" stop-color="#6F7FDB" stop-opacity=".9"/><stop offset="1" stop-color="#6F7FDB" stop-opacity="0"/></radialGradient>
    <!-- 그레인: 오로라처럼 여러 빛이 섞인 남 → 라벤더 + 입자 -->
    <radialGradient id="g-au1" cx=".15" cy=".1" r=".75"><stop offset="0" stop-color="#C9CFF7"/><stop offset="1" stop-color="#C9CFF7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-au2" cx=".95" cy=".55" r=".7"><stop offset="0" stop-color="#6F7FDB"/><stop offset="1" stop-color="#6F7FDB" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-au3" cx=".35" cy="1" r=".8"><stop offset="0" stop-color="#1E2766"/><stop offset="1" stop-color="#1E2766" stop-opacity="0"/></radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
    </filter>
    <!-- 클레이: 종이 바탕 -->
    <linearGradient id="g-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF9F4"/><stop offset="1" stop-color="#EDE8DC"/></linearGradient>

    <!-- ── 효과 ── -->
    <!-- 유리: 흐린 가장자리에 위쪽 왼쪽 빛(반사광) + 아래 옅은 그림자 -->
    <filter id="fx-glass" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
      <feSpecularLighting in="b" surfaceScale="3.5" specularConstant="1.1" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="225" elevation="45"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2="1" k3=".9" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="3" stdDeviation="3" flood-color="#0D1340" flood-opacity=".45"/>
    </filter>
    <!-- 클레이: 볼록 솟은 반사광 + 아래 부드러운 그림자 -->
    <filter id="fx-clay" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="16" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2="1" k3=".7" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="4" stdDeviation="3.5" flood-color="#1E2766" flood-opacity=".35"/>
    </filter>
    <!-- 리소: 잉크가 종이에 스민 듯 가장자리 거칠게 -->
    <filter id="fx-riso" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="squircle"><rect width="120" height="120" rx="27"/></clipPath>
  </defs>
</svg>

<div class="wrap">
  <h1>로고 · 요즘 스타일</h1>
  <p class="lead">상징 모양은 1 ~ 8(Logo.html) 그대로, 표현만 바꿨다. 색은 남색 한 계열. 아래 작은 두 개(40 · 24px)는 같은 아이콘을 줄인 것 — 효과가 작은 크기에서도 버티는지 보려고.<br>
  실제로 쓸 때는 앱 아이콘(홈 화면 · PWA)에만 효과를 넣고, 화면 안 로고 · 파비콘은 납작한 원래 상징을 쓰는 게 보통이다.</p>
  <table id="t"></table>
</div>

<script>
  const MARKS = [
    ['m1', '1 · 숨 원'], ['m2', '2 · 다시 보는 생각'], ['m3', '3 · 공책 한 장'], ['m4', '4 · 잔잔한 수평선'],
    ['m5', '5 · 비켜 선 두 원'], ['m6', '6 · 마음과 나'], ['m7', '7 · 물에 비친 원'], ['m8', '8 · 떨어진 반원 둘'],
  ];
  // 표현 방식마다 120 × 120 아이콘 SVG 안쪽을 만든다
  const STYLES = [
    { key: 'glass', name: '리퀴드 글래스', note: 'iOS 26풍 유리 겹',
      draw: id => `
        <rect width="120" height="120" fill="url(#g-glass)"/>
        <rect width="120" height="120" fill="url(#g-glow1)"/><rect width="120" height="120" fill="url(#g-glow2)"/>
        <rect x="1" y="1" width="118" height="118" rx="26" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <use href="#${id}" x="24" y="24" width="72" height="72" style="color:rgba(255,255,255,.62)" filter="url(#fx-glass)"/>` },
    { key: 'grain', name: '그레인 그라데이션', note: '오로라 + 입자 질감',
      draw: id => `
        <rect width="120" height="120" fill="#4457C2"/>
        <rect width="120" height="120" fill="url(#g-au2)"/><rect width="120" height="120" fill="url(#g-au3)"/><rect width="120" height="120" fill="url(#g-au1)"/>
        <rect width="120" height="120" filter="url(#noise)"/>
        <use href="#${id}" x="24" y="24" width="72" height="72" style="color:#FBF9F4"/>` },
    { key: 'clay', name: '소프트 3D', note: '종이 위 볼록한 잉크',
      draw: id => `
        <rect width="120" height="120" fill="url(#g-paper)"/>
        <use href="#${id}" x="22" y="20" width="76" height="76" style="color:#4457C2" filter="url(#fx-clay)"/>` },
    { key: 'riso', name: '리소 인쇄', note: '두 잉크가 살짝 어긋난 인쇄',
      draw: id => `
        <rect width="120" height="120" fill="#F5F2EA"/>
        <rect width="120" height="120" filter="url(#noise)" opacity=".6"/>
        <g style="mix-blend-mode:multiply" filter="url(#fx-riso)">
          <use href="#${id}" x="27" y="26" width="72" height="72" style="color:#9AA6F0"/>
          <use href="#${id}" x="22" y="22" width="72" height="72" style="color:#33449E"/>
        </g>` },
  ];
  const icon = (s, id, px) => `<svg class="icon" width="${px}" height="${px}" viewBox="0 0 120 120" role="img" aria-label="${s.name}"><g clip-path="url(#squircle)">${s.draw(id)}</g></svg>`;
  document.getElementById('t').innerHTML =
    `<tr><th></th>${STYLES.map(s => `<th>${s.name}<small>${s.note}</small></th>`).join('')}</tr>` +
    MARKS.map(([id, name]) => `<tr><td class="name">${name}</td>${STYLES.map(s => `
      <td class="cell"><div class="pair">${icon(s, id, 112)}<div class="mini">${icon(s, id, 40)}${icon(s, id, 24)}</div></div></td>`).join('')}</tr>`).join('');
</script>
</body>
</html>
