<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- 파비콘 · 비켜 선 두 원 (DESIGN 6장 "로고 · 부제"). 파일 하나라 CSS 변수를 못 써서 토큰 값을 그대로 적는다:
	     라이트 accent #33449E, 다크(브라우저 다크 테마) accent-text #A3AEF0 -->
	<style>
		g { color: #33449e; }
		@media (prefers-color-scheme: dark) { g { color: #a3aef0; } }
	</style>
	<g>
		<circle cx="22" cy="36" r="14" fill="currentColor" />
		<circle cx="43" cy="26" r="14" fill="none" stroke="currentColor" stroke-width="3.5" />
	</g>
</svg>
